<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FiscalTabuaço"><title>FiscalTabuaço</title><style>
:root{--g:#173d2d;--g2:#286046;--bg:#f4f5f2;--c:#fff;--t:#18221c;--m:#6b756e;--l:#dfe4df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;padding:28px 18px 18px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:25px}.sub{opacity:.8;font-size:13px}main{max-width:760px;margin:auto;padding:16px 14px 100px}.title{font-size:21px;font-weight:800}.muted{color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:15px;box-shadow:0 5px 20px #00000008}.action{min-height:110px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--l);cursor:pointer}.ico{font-size:27px}.action b{font-size:15px}.action small{color:var(--m)}label{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #d2dad3;border-radius:12px;padding:12px;background:#fff;color:var(--t);font:inherit}textarea{min-height:120px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:750;cursor:pointer}.primary{background:var(--g);color:white}.secondary{background:#edf1ed;color:var(--g)}.danger{background:#f8e9e7;color:#a63a31}.full{width:100%}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.badge{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:#edf1ed;color:var(--g)}.item{background:#fff;border:1px solid var(--l);border-radius:14px;padding:13px;margin:9px 0}.item h3{margin:0 0 5px;font-size:15px}.item p{margin:3px 0;color:var(--m);font-size:12px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(15px);border-top:1px solid var(--l);padding:8px 10px}.navin{max-width:760px;margin:auto;display:flex}.nav button{flex:1;background:transparent;color:var(--m);font-size:11px}.nav button.active{color:var(--g)}#toast{display:none;position:fixed;bottom:80px;left:15px;right:15px;background:#17221c;color:white;padding:12px;border-radius:12px;z-index:20}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>FiscalTabuaço</h1><div class="sub">Fiscalização municipal no terreno</div></header><main id="app"></main><div id="toast"></div><nav class="nav"><div class="navin"><button id="homeBtn" onclick="home()">⌂<br>Início</button><button onclick="newCase()">＋<br>Nova</button><button id="listBtn" onclick="listCases()">▣<br>Registos</button></div></nav>
<script>
"use strict";const KEY="FTAB1",T=["Obras / Urbanismo","Ocupação da via pública","Publicidade","Esplanadas","Licenciamento","PDM / Uso do solo","Segurança","Resíduos / Limpeza","Outros"],S=["Por verificar","Em análise","Notificado","Resolvido"];let edit=null,photos=[],gps=null;
const $=x=>document.getElementById(x),data=()=>JSON.parse(localStorage.getItem(KEY)||"[]"),save=x=>localStorage.setItem(KEY,JSON.stringify(x)),esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}
function nav(id){["homeBtn","listBtn"].forEach(x=>$(x).classList.remove("active"));if($(id))$(id).classList.add("active")}
function home(){edit=null;nav("homeBtn");let d=data();$("app").innerHTML='<div class="title">Início</div><div class="muted">Registe e acompanhe as suas fiscalizações.</div><div class="grid"><button class="card action" onclick="newCase()"><span class="ico">＋</span><b>Nova fiscalização</b><small>Registar ocorrência</small></button><button class="card action" onclick="listCases()"><span class="ico">▣</span><b>Fiscalizações</b><small>'+d.length+' registos</small></button><button class="card action" onclick="gpsNow()"><span class="ico">⌖</span><b>Localização GPS</b><small>Obter coordenadas</small></button><button class="card action" onclick="backup()"><span class="ico">⇩</span><b>Cópia de segurança</b><small>Exportar registos</small></button></div><div class="card" style="margin-top:14px"><b>Últimas fiscalizações</b>'+(d.length?d.slice().reverse().slice(0,4).map(card).join(""):'<p class="muted">Ainda não existem fiscalizações.</p>')+'</div>'}
function card(x){return '<div class="item" onclick="editCase(\''+x.id+'\')"><div class="row between"><h3>'+esc(x.type)+'</h3><span class="badge">'+esc(x.status)+'</span></div><p>'+esc(x.dateDisplay||x.date)+' · '+esc(x.address||"Sem local")+'</p><p>'+esc((x.desc||"").slice(0,100))+'</p></div>'}
function newCase(){edit=null;photos=[];gps=null;form({})}
function editCase(id){let x=data().find(a=>a.id===id);if(!x)return;edit=id;photos=x.photos||[];gps=x.gps||null;form(x)}
function form(x){nav("");$("app").innerHTML='<div class="row between"><div><div class="title">'+(edit?"Editar fiscalização":"Nova fiscalização")+'</div><div class="muted">Os dados ficam guardados neste dispositivo.</div></div><button class="secondary" onclick="home()">Fechar</button></div><div class="card" style="margin-top:12px"><label>Tipo</label><select id="type">'+T.map(t=>'<option '+(x.type===t?"selected":"")+'>'+t+'</option>').join("")+'</select><label>Data e hora</label><input id="date" type="datetime-local" value="'+(x.date||new Date().toISOString().slice(0,16))+'"><label>Morada / local</label><input id="address" value="'+esc(x.address)+'" placeholder="Rua, lugar, freguesia..."><div class="row" style="margin-top:8px"><button class="secondary" onclick="gpsNow()">Obter GPS</button><span id="gps" class="muted">'+(gps?"GPS obtido":"Ainda não obtido")+'</span></div><label>N.º processo / referência</label><input id="process" value="'+esc(x.process)+'"><label>Proprietário / requerente</label><input id="owner" value="'+esc(x.owner)+'"><label>Estado</label><select id="status">'+S.map(s=>'<option '+(x.status===s?"selected":"")+'> '+s+'</option>').join("")+'</select><label>Descrição dos factos</label><textarea id="desc" placeholder="Descreva objectivamente o que foi verificado...">'+esc(x.desc)+'</textarea><div class="row wrap"><button class="secondary" onclick="dictate()">Ditar ocorrência</button><button class="secondary" onclick="$(\'cam\').click()">Fotografar</button><input id="cam" type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="photosAdd(event)"></div><div id="photos" class="photos">'+photos.map(p=>'<img src="'+p+'">').join("")+'</div><label>Observações</label><textarea id="notes">'+esc(x.notes)+'</textarea><button class="primary full" style="margin-top:14px" onclick="saveCase()">Guardar fiscalização</button>'+(edit?'<button class="danger full" style="margin-top:8px" onclick="removeCase()">Eliminar</button>':'')+'</div>'}
function gpsNow(){if(!navigator.geolocation){toast("GPS não disponível.");return}navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};if($("gps"))$("gps").textContent="Lat "+gps.lat.toFixed(6)+" · Lon "+gps.lng.toFixed(6);if($("address")&&!$("address").value)$("address").value="GPS: "+gps.lat.toFixed(6)+", "+gps.lng.toFixed(6);toast("Localização obtida.")},()=>toast("Autorize a localização no navegador."),{enableHighAccuracy:true,timeout:12000})}
function photosAdd(e){[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{photos.push(r.result);$("photos").innerHTML=photos.map(p=>'<img src="'+p+'">').join("")};r.readAsDataURL(f)})}
function dictate(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$("desc").focus();toast("Use o ditado do teclado do iPhone.");return}let r=new R();r.lang="pt-PT";r.onresult=e=>$("desc").value+=($("desc").value?" ":"")+e.results[0][0].transcript;r.onerror=()=>toast("Não foi possível iniciar o ditado.");r.start()}
function saveCase(){let d=data(),old=edit?d.find(x=>x.id===edit):null,dt=$("date").value,x={id:edit||crypto.randomUUID(),type:$("type").value,date:dt,dateDisplay:new Date(dt).toLocaleString("pt-PT"),address:$("address").value,process:$("process").value,owner:$("owner").value,status:$("status").value.trim(),desc:$("desc").value,notes:$("notes").value,photos,gps:gps||old?.gps||null};save(edit?d.map(a=>a.id===x.id?x:a):d.concat(x));toast("Fiscalização guardada.");setTimeout(listCases,300)}
function removeCase(){if(confirm("Eliminar esta fiscalização?")){save(data().filter(x=>x.id!==edit));listCases()}}
function listCases(){nav("listBtn");let d=data().slice().reverse();$("app").innerHTML='<div class="row between"><div><div class="title">Fiscalizações</div><div class="muted">'+d.length+' registos neste dispositivo.</div></div><button class="primary" onclick="newCase()">＋ Nova</button></div><input id="q" style="margin:12px 0" placeholder="Pesquisar..." oninput="filter()"><div id="results">'+(d.length?d.map(card).join(""):'<div class="card"><span class="muted">Não existem registos.</span></div>')+'</div>'}
function filter(){let q=$("q").value.toLowerCase();$("results").innerHTML=data().slice().reverse().filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(card).join("")||'<div class="card"><span class="muted">Sem resultados.</span></div>'}
function backup(){let b=new Blob([JSON.stringify(data(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="FiscalTabuaco-backup.json";a.click();toast("Cópia preparada.")}
home();
</script></body></html>
